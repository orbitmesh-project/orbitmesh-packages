name: Publish package

# Builds, packs and publishes one package's .nupkg to the official OrbitMesh NuGet feed
# (https://nuget.orbitmesh.org, feed slug "OrbitMesh", hosted on Pepite), on a
# "<FolderName>-v<version>" tag - e.g. "DayInfo-v1.2.0". <FolderName> must match a folder in this
# repo exactly (case-sensitive) and <version> must match that project's own <Version>.
#
# Uses Pepite's Trusted Publishing: GitHub mints an identity token for this workflow, Pepite
# exchanges it for a 15-minute publish key scoped to packages.push - no stored NuGet API key.
# See https://github.com/forgelab-me/pepite/blob/main/docs/trusted-publishing.md
#
# Requires a protected environment named `release` (tag policy allowing *-v*), matching what the
# feed's trusted publisher is pinned to - a run outside it gets no credential at all.

on:
  push:
    tags: ['*-v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. DayInfo-v1.2.0'
        required: true

permissions:
  contents: read
  id-token: write # to mint the identity token, and nothing else

concurrency: publish-package-${{ github.event.inputs.tag || github.ref }}

env:
  SERVER: https://nuget.orbitmesh.org
  FEED: OrbitMesh
  UA: 'orbitmesh-packages-publish (+https://github.com/orbitmesh-project/orbitmesh-packages)'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve the package name from the tag, and check it agrees with the csproj version
        id: tag
        shell: pwsh
        env:
          # Never interpolate ${{ }} directly into a run: script body - it's a straight text
          # substitution done before the shell ever sees it, so an untrusted tag/input containing
          # shell metacharacters would be injected as code, not passed as a value. env: is immune to
          # this (it becomes a real OS environment variable, not text pasted into the script).
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $tag = $env:TAG
          if ($tag -notmatch '^(?<name>.+)-v(?<version>\d+\.\d+\.\d+)$') {
            Write-Error "Tag '$tag' doesn't match '<FolderName>-v<version>' (e.g. DayInfo-v1.2.0)."
            exit 1
          }
          $name = $Matches.name
          $version = $Matches.version

          $csprojPath = Join-Path $name "OrbitMesh.$name.csproj"
          if (-not (Test-Path $csprojPath)) {
            Write-Error "No project '$csprojPath' for tag '$tag' - the tag's package name must match a folder in this repo exactly (case-sensitive)."
            exit 1
          }

          [xml]$csproj = Get-Content $csprojPath
          $csprojVersion = ($csproj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if ($csprojVersion -ne $version) {
            Write-Error "Tag says $version but $csprojPath has <Version>$csprojVersion</Version> - bump one of them."
            exit 1
          }

          "name=$name" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build and pack
        shell: pwsh
        working-directory: cicd
        env:
          NAME: ${{ steps.tag.outputs.name }}
        run: .\build-packages.ps1 -Only $env:NAME

      - name: Exchange the GitHub identity for a publish key
        id: auth
        shell: bash
        run: |
          set -eu
          OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$SERVER" | jq -r .value)

          if [ -z "$OIDC" ] || [ "$OIDC" = null ]; then
            echo "::error::GitHub minted no identity token - check that the job has id-token: write."
            exit 1
          fi

          # Status and body kept apart, so a refusal shows what Pepite actually said - piping curl
          # straight into jq turns every failure into a parse error and loses the message.
          STATUS=$(curl -sS -X POST -A "$UA" \
            -H "Authorization: Bearer $OIDC" \
            -o "$RUNNER_TEMP/mint.json" -w '%{http_code}' \
            "$SERVER/feeds/$FEED/api/v2/publish/token")

          if [ "$STATUS" != 201 ]; then
            echo "::error::Pepite refused to mint a publish key (HTTP $STATUS) - is the trusted publisher configured for this repo/environment on the feed's Publishers page?"
            cat "$RUNNER_TEMP/mint.json"
            echo
            exit 1
          fi

          KEY=$(jq -r .token < "$RUNNER_TEMP/mint.json")
          rm -f "$RUNNER_TEMP/mint.json"

          echo "::add-mask::$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: dotnet nuget push
        shell: bash
        env:
          KEY: ${{ steps.auth.outputs.key }}
          NUPKG: cicd/build/OrbitMesh.${{ steps.tag.outputs.name }}.${{ steps.tag.outputs.version }}.nupkg
        run: |
          set -eu
          dotnet nuget push "$NUPKG" -s "$SERVER/feeds/$FEED/v3/index.json" -k "$KEY"

      - name: Summary
        if: success()
        env:
          NAME: ${{ steps.tag.outputs.name }}
          VERSION: ${{ steps.tag.outputs.version }}
        shell: bash
        run: |
          {
            echo "### Published OrbitMesh.$NAME $VERSION"
            echo
            echo "$SERVER/feeds/$FEED/v3/index.json"
          } >> "$GITHUB_STEP_SUMMARY"
